services:
  - type: web
    name: helpdesk
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      - key: DJANGO_SUPERUSER_CORREO
        value: admin@helpdesk.com
      - key: DJANGO_SUPERUSER_NOMBRE
        value: Administrador
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false   # Render te la pedirá al crear el servicio

databases:
  - name: helpdesk-db
    plan: free
